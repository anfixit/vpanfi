<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#f7f4ed" />
    <title>Подписка VPaNfi — открываем приложение</title>
    <!--
      Страница-переходник между ботом и приложением, в которое человек
      добавляет подписку: Happ, V2RayTun, Streisand — любое установленное,
      умеющее принять ссылку. Своего приложения у VPaNfi нет, и текст
      здесь написан так, чтобы это не читалось наоборот.

      Telegram не пускает в кнопку адрес вида happ://add/…: в inline-кнопке
      разрешён только http(s). Поэтому бот подставляет сюда обычную ссылку,
      а эта страница уже открывает приложение сама. Она намеренно живёт
      отдельно от приложения сайта: открывается за один запрос, без сборки
      и без React, и переживает любую переделку сайта.

      Оформление вписано прямо в файл по той же причине: страница видна
      доли секунды, и ради неё не стоит ждать загрузки общих стилей.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --background: #f7f4ed;
        --surface: #fffdfa;
        --text: #262321;
        --muted: #716d68;
        --primary: #7375cf;
        --line: rgba(87, 74, 60, 0.13);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #191c1d;
          --surface: #242829;
          --text: #f1ede7;
          --muted: #b0aaa2;
          --primary: #9a9ce7;
          --line: rgba(255, 255, 255, 0.1);
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--background);
        color: var(--text);
        font-family:
          "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        text-align: center;
      }

      .card {
        max-width: 420px;
        width: 100%;
        padding: 32px 24px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 16px 50px rgba(76, 60, 45, 0.09);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        line-height: 1.3;
      }

      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: var(--muted);
      }

      a.button {
        display: inline-block;
        margin-top: 22px;
        padding: 13px 30px;
        border-radius: 13px;
        background: var(--primary);
        color: #fffdfa;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }

      a.button[hidden] {
        display: none;
      }

      a.button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="title">Открываем ваше приложение…</h1>
      <p id="hint">
        Подписка добавится в приложение сама. Если оно не открылось —
        нажмите кнопку ниже.
      </p>
      <a id="open" class="button" href="#" rel="noopener" hidden
        >Открыть приложение</a
      >
    </main>
    <script src="./open.js"></script>
  </body>
</html>
