server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The API mounts its own health endpoint at the root, while everything
    # else lives under /api/v1. Mapping it explicitly keeps a single
    # /api/healthz probe available from outside the Compose network.
    location = /api/healthz {
        access_log off;
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Витрина и продажа берутся у бота: тарифы, цены и приём платежей
    # живут там, и вторая их копия на сайте означала бы вторую кассу.
    #
    # Запрос идёт через nginx, а не из браузера напрямую: политика
    # безопасности страницы разрешает обращения только к своему домену
    # (connect-src 'self'), и обращение к vpanfibot.ru браузер бы
    # заблокировал. Заодно не нужен CORS.
    location /shop/ {
        proxy_pass https://vpanfibot.ru/cabinet/landing/;
        proxy_set_header Host vpanfibot.ru;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /mascots/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Страницы документов лежат готовыми файлами (legal/offer/index.html).
    # try_files с $uri/ отдавал бы на них 301 со слешем, а Location nginx
    # строит по внутреннему адресу контейнера — снаружи такой редирект
    # ведёт в никуда. Поэтому индекс каталога подставляется сразу, без
    # редиректа, и адрес остаётся без хвостового слеша.
    absolute_redirect off;

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Разрешено ровно то, что действительно используется: шрифты с
    # Google Fonts и виджет входа Telegram, который грузит свой скрипт и
    # открывает свой iframe. Ничего больше.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://t.me; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src https://oauth.telegram.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
}
