name: Deploy production

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpanfi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Trust the production host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -T 15 -p "$DEPLOY_PORT" "$DEPLOY_HOST" \
            > "$RUNNER_TEMP/host_keys" 2>/dev/null

          # The server offers several host key types and the secret records
          # only one of them, so the key we pin is the one whose fingerprint
          # matches. Nothing is trusted when nothing matches.
          expected="${DEPLOY_HOST_FINGERPRINT#SHA256:}"
          matched=""

          while IFS= read -r host_key; do
            [ -n "$host_key" ] || continue
            printf '%s\n' "$host_key" > "$RUNNER_TEMP/candidate_key"
            actual="$(ssh-keygen -lf "$RUNNER_TEMP/candidate_key" | awk '{print $2}')"
            if [ "${actual#SHA256:}" = "$expected" ]; then
              matched="$host_key"
            fi
          done < "$RUNNER_TEMP/host_keys"

          if [ -z "$matched" ]; then
            echo "::error::DEPLOY_HOST_FINGERPRINT matches none of the host keys offered by the server. Regenerate it with: ssh-keyscan -p PORT HOST | ssh-keygen -lf -"
            exit 1
          fi

          printf '%s\n' "$matched" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VPANFI_REMNAWAVE_BASE_URL: ${{ secrets.VPANFI_REMNAWAVE_BASE_URL }}
          VPANFI_REMNAWAVE_API_TOKEN: ${{ secrets.VPANFI_REMNAWAVE_API_TOKEN }}
          VPANFI_PLATEGA_MERCHANT_ID: ${{ secrets.VPANFI_PLATEGA_MERCHANT_ID }}
          VPANFI_PLATEGA_SECRET: ${{ secrets.VPANFI_PLATEGA_SECRET }}
          VPANFI_SMTP_HOST: ${{ secrets.VPANFI_SMTP_HOST }}
          VPANFI_SMTP_PORT: ${{ vars.VPANFI_SMTP_PORT }}
          VPANFI_SMTP_USER: ${{ secrets.VPANFI_SMTP_USER }}
          VPANFI_SMTP_PASSWORD: ${{ secrets.VPANFI_SMTP_PASSWORD }}
          VPANFI_SMTP_FROM_EMAIL: ${{ vars.VPANFI_SMTP_FROM_EMAIL }}
          VPANFI_SMTP_FROM_NAME: ${{ vars.VPANFI_SMTP_FROM_NAME }}
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE }}
          VPANFI_TELEGRAM_LOGIN_BOT_TOKEN: ${{ secrets.VPANFI_TELEGRAM_LOGIN_BOT_TOKEN }}
          VPANFI_TELEGRAM_LOGIN_BOT_USERNAME: ${{ vars.VPANFI_TELEGRAM_LOGIN_BOT_USERNAME }}
          VPANFI_VK_CLIENT_ID: ${{ vars.VPANFI_VK_CLIENT_ID }}
          VPANFI_VK_CLIENT_SECRET: ${{ secrets.VPANFI_VK_CLIENT_SECRET }}
          VPANFI_YANDEX_CLIENT_ID: ${{ vars.VPANFI_YANDEX_CLIENT_ID }}
          VPANFI_YANDEX_CLIENT_SECRET: ${{ secrets.VPANFI_YANDEX_CLIENT_SECRET }}
          VPANFI_OAUTH_REDIRECT_URL: ${{ vars.VPANFI_OAUTH_REDIRECT_URL }}
        run: |
          set -euo pipefail

          # The panel credentials travel inside the SSH channel rather than
          # on the remote command line, so they never appear in the
          # server's process list. Unset values are passed as empty and the
          # deploy script then leaves .env alone.
          payload="$RUNNER_TEMP/deploy_payload.sh"
          {
            printf 'export VPANFI_REMNAWAVE_BASE_URL=%q\n' \
              "${VPANFI_REMNAWAVE_BASE_URL:-}"
            printf 'export VPANFI_REMNAWAVE_API_TOKEN=%q\n' \
              "${VPANFI_REMNAWAVE_API_TOKEN:-}"
            printf 'export VPANFI_PLATEGA_MERCHANT_ID=%q\n' \
              "${VPANFI_PLATEGA_MERCHANT_ID:-}"
            printf 'export VPANFI_PLATEGA_SECRET=%q\n' \
              "${VPANFI_PLATEGA_SECRET:-}"
            printf 'export VPANFI_SMTP_HOST=%q\n' "${VPANFI_SMTP_HOST:-}"
            printf 'export VPANFI_SMTP_PORT=%q\n' "${VPANFI_SMTP_PORT:-}"
            printf 'export VPANFI_SMTP_USER=%q\n' "${VPANFI_SMTP_USER:-}"
            printf 'export VPANFI_SMTP_PASSWORD=%q\n' \
              "${VPANFI_SMTP_PASSWORD:-}"
            printf 'export VPANFI_SMTP_FROM_EMAIL=%q\n' \
              "${VPANFI_SMTP_FROM_EMAIL:-}"
            printf 'export VPANFI_SMTP_FROM_NAME=%q\n' \
              "${VPANFI_SMTP_FROM_NAME:-}"
            printf 'export VITE_DEMO_MODE=%q\n' "${VITE_DEMO_MODE:-}"
            printf 'export VPANFI_TELEGRAM_LOGIN_BOT_TOKEN=%q\n' \
              "${VPANFI_TELEGRAM_LOGIN_BOT_TOKEN:-}"
            printf 'export VPANFI_TELEGRAM_LOGIN_BOT_USERNAME=%q\n' \
              "${VPANFI_TELEGRAM_LOGIN_BOT_USERNAME:-}"
            printf 'export VPANFI_VK_CLIENT_ID=%q\n' "${VPANFI_VK_CLIENT_ID:-}"
            printf 'export VPANFI_VK_CLIENT_SECRET=%q\n' \
              "${VPANFI_VK_CLIENT_SECRET:-}"
            printf 'export VPANFI_YANDEX_CLIENT_ID=%q\n' \
              "${VPANFI_YANDEX_CLIENT_ID:-}"
            printf 'export VPANFI_YANDEX_CLIENT_SECRET=%q\n' \
              "${VPANFI_YANDEX_CLIENT_SECRET:-}"
            printf 'export VPANFI_OAUTH_REDIRECT_URL=%q\n' \
              "${VPANFI_OAUTH_REDIRECT_URL:-}"
            cat scripts/remote-bootstrap.sh
          } > "$payload"

          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' < "$payload"

      - name: Remove the deployment key
        if: always()
        run: rm -f ~/.ssh/deploy_key
