name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpanfi-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          timeout: 30s
          command_timeout: 25m
          script: |
            set -Eeuo pipefail

            APP_DIR=/opt/vpanfi
            REPO_URL=https://github.com/anfixit/vpanfi.git

            if [ ! -d "$APP_DIR/.git" ]; then
              if [ -n "$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
                echo "ERROR: $APP_DIR is not empty and is not a Git repository"
                exit 1
              fi

              git clone --branch main --single-branch "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            chmod +x scripts/deploy.sh
            APP_DIR="$APP_DIR" ./scripts/deploy.sh
