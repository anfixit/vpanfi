services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vpanfi-web:local
    container_name: vpanfi-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VPANFI_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
