services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_TELEGRAM_SUPPORT_URL: ${VITE_TELEGRAM_SUPPORT_URL:-https://t.me/Anfikus}
        VITE_TELEGRAM_BOT_URL: ${VITE_TELEGRAM_BOT_URL:-https://t.me/VPaNfi_bot}
    image: vpanfi-web:local
    container_name: vpanfi-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VPANFI_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - vpanfi
      # Снаружи сайт открывает Caddy, который живёт в стеке панели и
      # ходит по имени контейнера. Без этой сети он его не видит, и сайт
      # отвечает 502 — ровно это и случалось после каждой пересборки,
      # пока сеть подключали руками.
      - remnawave-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vpanfi-api:local
    container_name: vpanfi-api
    restart: unless-stopped
    environment:
      VPANFI_ENVIRONMENT: ${VPANFI_ENVIRONMENT:-development}
      VPANFI_FRONTEND_ORIGIN: ${VPANFI_FRONTEND_ORIGIN:-http://localhost:8080}
      VPANFI_DATABASE_URL: postgresql+asyncpg://vpanfi:${POSTGRES_PASSWORD:-vpanfi}@postgres:5432/vpanfi
      VPANFI_REDIS_URL: redis://redis:6379/0
      VPANFI_JWT_SECRET: ${VPANFI_JWT_SECRET:-change-me-before-production}
      VPANFI_REMNAWAVE_BASE_URL: ${VPANFI_REMNAWAVE_BASE_URL:-}
      VPANFI_REMNAWAVE_API_TOKEN: ${VPANFI_REMNAWAVE_API_TOKEN:-}
      VPANFI_REMNAWAVE_SQUAD_UUID: ${VPANFI_REMNAWAVE_SQUAD_UUID:-}
      VPANFI_TELEGRAM_ALERT_BOT_TOKEN: ${VPANFI_TELEGRAM_ALERT_BOT_TOKEN:-}
      VPANFI_TELEGRAM_ALERT_CHAT_ID: ${VPANFI_TELEGRAM_ALERT_CHAT_ID:-}
      VPANFI_PLATEGA_MERCHANT_ID: ${VPANFI_PLATEGA_MERCHANT_ID:-}
      VPANFI_PLATEGA_SECRET: ${VPANFI_PLATEGA_SECRET:-}
      VPANFI_SMTP_HOST: ${VPANFI_SMTP_HOST:-}
      VPANFI_SMTP_PORT: ${VPANFI_SMTP_PORT:-2525}
      VPANFI_SMTP_USER: ${VPANFI_SMTP_USER:-}
      VPANFI_SMTP_PASSWORD: ${VPANFI_SMTP_PASSWORD:-}
      VPANFI_SMTP_FROM_EMAIL: ${VPANFI_SMTP_FROM_EMAIL:-}
      VPANFI_SMTP_FROM_NAME: ${VPANFI_SMTP_FROM_NAME:-VPaNfi}
      VPANFI_TELEGRAM_LOGIN_BOT_TOKEN: ${VPANFI_TELEGRAM_LOGIN_BOT_TOKEN:-}
      VPANFI_TELEGRAM_LOGIN_BOT_USERNAME: ${VPANFI_TELEGRAM_LOGIN_BOT_USERNAME:-}
      VPANFI_VK_CLIENT_ID: ${VPANFI_VK_CLIENT_ID:-}
      VPANFI_VK_CLIENT_SECRET: ${VPANFI_VK_CLIENT_SECRET:-}
      VPANFI_YANDEX_CLIENT_ID: ${VPANFI_YANDEX_CLIENT_ID:-}
      VPANFI_YANDEX_CLIENT_SECRET: ${VPANFI_YANDEX_CLIENT_SECRET:-}
      VPANFI_OAUTH_REDIRECT_URL: ${VPANFI_OAUTH_REDIRECT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - vpanfi

  postgres:
    image: postgres:16-alpine
    container_name: vpanfi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpanfi
      POSTGRES_USER: vpanfi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpanfi}
    volumes:
      - vpanfi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpanfi -d vpanfi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpanfi

  redis:
    image: redis:7-alpine
    container_name: vpanfi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - vpanfi-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vpanfi

volumes:
  vpanfi-postgres:
  vpanfi-redis:

networks:
  vpanfi:
    driver: bridge
  remnawave-network:
    external: true
